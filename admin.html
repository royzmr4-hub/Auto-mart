```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Mart | Admin Panel</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <div class="container nav">

    <a href="index.html" class="logo">
      <span>AM</span>
      Auto Mart
    </a>

    <nav>
      <a href="index.html">Store</a>
      <a href="admin.html" class="active">Admin</a>
    </nav>

    <a href="index.html" class="btn small">
      View Store
    </a>

  </div>
</header>

<main class="container admin">

  <div class="page-title">
    <p class="eyebrow">STORE MANAGEMENT</p>
    <h1>Admin Panel</h1>
    <p>
      Add, edit and delete products from your Auto Mart catalog.
    </p>
  </div>

  <div class="admin-grid">

    <!-- PRODUCT FORM -->
    <section class="panel">

      <div class="panel-title">
        <div>
          <p class="eyebrow">PRODUCT EDITOR</p>
          <h2 id="formTitle">Add Product</h2>
        </div>
      </div>

      <form id="productForm">

        <input type="hidden" id="editId">

        <label>
          Product Name
          <input
            id="productName"
            required
            placeholder="Example: Engine Air Filter"
          >
        </label>

        <label>
          Price (₮)
          <input
            id="productPrice"
            type="number"
            min="0"
            required
            placeholder="45000"
          >
        </label>

        <label>
          Image URL
          <input
            id="productImage"
            type="url"
            required
            placeholder="https://..."
          >
        </label>

        <label>
          Description
          <textarea
            id="productDescription"
            rows="3"
            placeholder="Short product description"
          ></textarea>
        </label>

        <div class="form-buttons">

          <button
            type="submit"
            class="btn primary"
            id="saveBtn"
          >
            Add Product
          </button>

          <button
            type="button"
            class="btn hidden"
            id="cancelBtn"
          >
            Cancel
          </button>

        </div>

      </form>

      <div class="admin-tip">
        Products are currently stored in browser localStorage.
      </div>

    </section>

    <!-- PRODUCT LIST -->
    <section class="panel">

      <div class="panel-title product-list-title">

        <div>
          <p class="eyebrow">CATALOG</p>
          <h2>Products</h2>
        </div>

        <button
          class="btn small danger"
          onclick="resetProducts()"
        >
          Reset Demo
        </button>

      </div>

      <div id="adminProducts"></div>

    </section>

  </div>

</main>

<div id="toast" class="toast"></div>

<footer>
  <div class="container">
    © 2026 Auto Mart. Admin Panel.
  </div>
</footer>

<script src="app.js"></script>

</body>
</html>
```
